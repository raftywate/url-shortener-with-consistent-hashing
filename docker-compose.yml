services:

  postgres:

    image: postgres:17

    container_name: url-shortener-postgres

    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql


  redis:

    image: redis:7

    container_name: url-shortener-redis

    ports:
      - "6379:6379"


  backend:

    build:
      context: ./backend

    container_name: url-shortener-backend

    depends_on:
      - postgres
      - redis

    ports:
      - "8080:8080"

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      DEMO_SEEDING_ENABLED: ${DEMO_SEEDING_ENABLED:-true}
      ACTIVE_SHARDS_COUNT: ${ACTIVE_SHARDS_COUNT:-3}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-5}


  frontend:

    build:
      context: ./frontend

    container_name: url-shortener-frontend

    depends_on:
      - backend

    ports:
      - "5173:5173"
    
    volumes:
    - ./frontend:/app
    - /app/node_modules

volumes:
  postgres_data: